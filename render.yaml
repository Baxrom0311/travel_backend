# Render.com Blueprint
# Free plan bilan PostgreSQL + Web Service
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: travel-db
    plan: free  # 90 kunlik limit
    databaseName: travel
    user: travel

services:
  - type: web
    name: travel-backend
    runtime: python
    plan: free
    region: frankfurt  # Yoki singapore, oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: travel-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://travel-frontend.vercel.app"
      - key: API_PAGE_SIZE
        value: "20"
      - key: CONTACT_THROTTLE_RATE
        value: "5/hour"
      - key: WEB_CONCURRENCY
        value: "2"
